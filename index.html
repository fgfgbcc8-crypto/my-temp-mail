<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إيميل مؤقت</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 10px; background: #f5f5f5; }
    h1 { text-align: center; }
    .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 5px; }
    button:hover { background: #0056b3; }
    .email { font-size: 1.2em; font-weight: bold; color: #333; word-break: break-all; }
    .msg-list { list-style: none; padding: 0; }
    .msg-item { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 5px; cursor: pointer; }
    .msg-item:hover { background: #e9e9e9; }
    .msg-content { background: #fff; border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-top: 10px; white-space: pre-wrap; }
    .small { font-size: 0.9em; color: #666; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>📧 إيميل مؤقت</h1>
  
  <div class="box">
    <button id="btnGenerate">إنشاء إيميل جديد</button>
    <div id="emailInfo" class="hidden">
      <p>الإيميل: <span id="emailAddress" class="email"></span></p>
      <p class="small">كلمة السر: <span id="emailPassword"></span></p>
      <button id="btnRefresh">تحديث الرسائل</button>
    </div>
  </div>

  <div class="box">
    <h2>الرسائل الواردة</h2>
    <ul id="messages" class="msg-list"></ul>
    <div id="messageView" class="msg-content hidden"></div>
  </div>

  <script>
    const API_BASE = 'https://api.mail.tm';
    let token = null;
    let currentEmail = '';
    let currentPassword = '';
    let currentAccountId = null;

    // إنشاء إيميل عشوائي
    async function generateEmail() {
      try {
        // 1. جلب الدومينات المتاحة
        const domainsRes = await fetch(`${API_BASE}/domains`);
        const domainsData = await domainsRes.json();
        const domain = domainsData['hydra:member'][0].domain;

        // 2. توليد اسم عشوائي
        const randomName = Math.random().toString(36).substring(2, 12);
        const email = `${randomName}@${domain}`;
        const password = 'password123'; // كلمة سر ثابتة للتبسيط

        // 3. إنشاء الحساب
        const accRes = await fetch(`${API_BASE}/accounts`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: email, password: password })
        });
        if (!accRes.ok) throw new Error('فشل إنشاء الحساب');
        const accData = await accRes.json();
        currentAccountId = accData.id;

        // 4. تسجيل الدخول للحصول على التوكن
        const tokenRes = await fetch(`${API_BASE}/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address: email, password: password })
        });
        const tokenData = await tokenRes.json();
        token = tokenData.token;
        currentEmail = email;
        currentPassword = password;

        // عرض المعلومات
        document.getElementById('emailAddress').textContent = email;
        document.getElementById('emailPassword').textContent = password;
        document.getElementById('emailInfo').classList.remove('hidden');
        document.getElementById('messages').innerHTML = '';
        document.getElementById('messageView').classList.add('hidden');

        // بدء التحديث التلقائي
        fetchMessages();
        setInterval(fetchMessages, 10000); // كل 10 ثواني
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      }
    }

    // جلب الرسائل
    async function fetchMessages() {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/messages`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const messages = data['hydra:member'] || [];
        const list = document.getElementById('messages');
        list.innerHTML = '';
        if (messages.length === 0) {
          list.innerHTML = '<li class="small">لا توجد رسائل بعد...</li>';
          return;
        }
        messages.forEach(msg => {
          const li = document.createElement('li');
          li.className = 'msg-item';
          li.innerHTML = `
            <strong>${msg.from.address}</strong><br>
            <span>${msg.subject}</span><br>
            <span class="small">${new Date(msg.createdAt).toLocaleString('ar-EG')}</span>
          `;
          li.onclick = () => viewMessage(msg.id);
          list.appendChild(li);
        });
      } catch (err) {
        console.error(err);
      }
    }

    // عرض محتوى رسالة
    async function viewMessage(id) {
      if (!token) return;
      try {
        const res = await fetch(`${API_BASE}/messages/${id}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const msg = await res.json();
        const view = document.getElementById('messageView');
        view.classList.remove('hidden');
        view.innerHTML = `
          <h3>${msg.subject}</h3>
          <p><strong>من:</strong> ${msg.from.address}</p>
          <p><strong>إلى:</strong> ${msg.to.map(t => t.address).join(', ')}</p>
          <hr>
          <div>${msg.html || msg.text || 'لا يوجد محتوى'}</div>
        `;
      } catch (err) {
        alert('فشل تحميل الرسالة');
      }
    }

    // ربط الأحداث
    document.getElementById('btnGenerate').addEventListener('click', generateEmail);
    document.getElementById('btnRefresh').addEventListener('click', fetchMessages);
  </script>
</body>
</html>
